[project]
name = "math-materials"
version = "0.0.0"
requires-python = ">=3.13"
dependencies = [
    "google-api-python-client>=2,<3",
    "google-auth-oauthlib>=1,<2",
    "olefile>=0.47,<1",
    "python-telegram-bot>=22,<23",
]

[dependency-groups]
dev = [
    "ruff>=0.16,<0.17",
    "pyright>=1.1.411,<2",
]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["scripts"]
pythonVersion = "3.13"
typeCheckingMode = "basic"
