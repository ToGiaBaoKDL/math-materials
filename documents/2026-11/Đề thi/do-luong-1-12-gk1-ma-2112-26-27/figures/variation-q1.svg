<svg xmlns="http://www.w3.org/2000/svg" width="120mm" height="43mm" viewBox="0 0 120 43">
<defs>
  <marker id="arr" markerWidth="4" markerHeight="4" refX="3.8" refY="2" orient="auto">
    <path d="M0,0 L4,2 L0,4 Z" fill="#222" />
  </marker>
</defs>
<rect x="1" y="1" width="118" height="9" fill="#F2B8C5" />
<path d="M1,10 L119,10" fill="none" stroke="#222" stroke-width=".5" />
<path d="M1,19 L119,19" fill="none" stroke="#222" stroke-width=".5" />
<path d="M12,1 L12,42" fill="none" stroke="#222" stroke-width=".5" />
<text x="6.5" y="7" text-anchor="middle" font-family="Times New Roman" font-style="italic" font-size="3.8" fill="#111">x</text>
<text x="6.5" y="16" text-anchor="middle" font-family="Times New Roman" font-style="italic" font-size="3.8" fill="#111">y′</text>
<text x="6.5" y="32" text-anchor="middle" font-family="Times New Roman" font-style="italic" font-size="3.8" fill="#111">y</text>

<!-- x values -->
<text x="20.0" y="7" text-anchor="middle" font-family="Times New Roman" font-size="3.8" fill="#111">−∞</text>
<text x="52.0" y="7" text-anchor="middle" font-family="Times New Roman" font-size="3.8" fill="#111">−1</text>
<text x="84.0" y="7" text-anchor="middle" font-family="Times New Roman" font-size="3.8" fill="#111">1</text>
<text x="112.0" y="7" text-anchor="middle" font-family="Times New Roman" font-size="3.8" fill="#111">+∞</text>

<!-- y' values -->
<text x="36.0" y="16" text-anchor="middle" font-family="Times New Roman" font-size="3.8" fill="#111">+</text>
<!-- double bar at x = -1 -->
<path d="M51.6,10 L51.6,42" fill="none" stroke="#222" stroke-width=".5" />
<path d="M52.4,10 L52.4,42" fill="none" stroke="#222" stroke-width=".5" />
<text x="68.0" y="16" text-anchor="middle" font-family="Times New Roman" font-size="3.8" fill="#111">+</text>
<text x="84.0" y="16" text-anchor="middle" font-family="Times New Roman" font-size="3.8" fill="#111">0</text>
<text x="98.0" y="16" text-anchor="middle" font-family="Times New Roman" font-size="3.8" fill="#111">−</text>

<!-- y values & arrows -->
<!-- -inf to -1: 2 to 4 -->
<text x="20.0" y="40" text-anchor="middle" font-family="Times New Roman" font-size="3.8" fill="#111">2</text>
<text x="47.0" y="24" text-anchor="middle" font-family="Times New Roman" font-size="3.8" fill="#111">4</text>
<path d="M24.0,38 L44.0,26" fill="none" stroke="#222" stroke-width=".42" marker-end="url(#arr)" />

<!-- -1 to 1: -inf to 3 -->
<text x="58.0" y="40" text-anchor="middle" font-family="Times New Roman" font-size="3.8" fill="#111">−∞</text>
<text x="84.0" y="24" text-anchor="middle" font-family="Times New Roman" font-size="3.8" fill="#111">3</text>
<path d="M63.0,38 L80.0,26" fill="none" stroke="#222" stroke-width=".42" marker-end="url(#arr)" />

<!-- 1 to +inf: 3 to -1 -->
<text x="112.0" y="38" text-anchor="middle" font-family="Times New Roman" font-size="3.8" fill="#111">−1</text>
<path d="M88.0,26 L108.0,36" fill="none" stroke="#222" stroke-width=".42" marker-end="url(#arr)" />

<!-- outer border -->
<rect x="1" y="1" width="118" height="41" fill="none" stroke="#222" stroke-width=".5" />
</svg>