<svg xmlns="http://www.w3.org/2000/svg" width="115mm" height="40mm" viewBox="0 0 115 40">
<defs>
  <marker id="arr" markerWidth="4" markerHeight="4" refX="3.8" refY="2" orient="auto">
    <path d="M0,0 L4,2 L0,4 Z" fill="#222" />
  </marker>
</defs>
<rect x="1" y="1" width="113" height="9" fill="#F2B8C5" />
<path d="M1,10 L114,10" fill="none" stroke="#222" stroke-width=".5" />
<path d="M1,18 L114,18" fill="none" stroke="#222" stroke-width=".5" />
<path d="M12,1 L12,39" fill="none" stroke="#222" stroke-width=".5" />
<text x="6.5" y="7" text-anchor="middle" font-family="Times New Roman" font-style="italic" font-size="3.8" fill="#111">x</text>
<text x="6.5" y="15.5" text-anchor="middle" font-family="Times New Roman" font-style="italic" font-size="3.8" fill="#111">y′</text>
<text x="6.5" y="30" text-anchor="middle" font-family="Times New Roman" font-style="italic" font-size="3.8" fill="#111">y</text>

<!-- x values -->
<text x="22.0" y="7" text-anchor="middle" font-family="Times New Roman" font-size="3.8" fill="#111">−∞</text>
<text x="63.0" y="7" text-anchor="middle" font-family="Times New Roman" font-size="3.8" fill="#111">2</text>
<text x="104.0" y="7" text-anchor="middle" font-family="Times New Roman" font-size="3.8" fill="#111">+∞</text>

<!-- y' values -->
<text x="38.0" y="15.5" text-anchor="middle" font-family="Times New Roman" font-size="3.8" fill="#111">+</text>
<!-- double bar at x = 2 -->
<path d="M62.6,10 L62.6,39" fill="none" stroke="#222" stroke-width=".5" />
<path d="M63.4,10 L63.4,39" fill="none" stroke="#222" stroke-width=".5" />
<text x="88.0" y="15.5" text-anchor="middle" font-family="Times New Roman" font-size="3.8" fill="#111">+</text>

<!-- y values & arrows -->
<!-- -inf to 2: 3 to +inf -->
<text x="22.0" y="37" text-anchor="middle" font-family="Times New Roman" font-size="3.8" fill="#111">3</text>
<text x="56.0" y="24" text-anchor="middle" font-family="Times New Roman" font-size="3.8" fill="#111">+∞</text>
<path d="M26.0,35 L50.0,26" fill="none" stroke="#222" stroke-width=".42" marker-end="url(#arr)" />

<!-- 2 to +inf: -inf to 3 -->
<text x="70.0" y="37" text-anchor="middle" font-family="Times New Roman" font-size="3.8" fill="#111">−∞</text>
<text x="104.0" y="24" text-anchor="middle" font-family="Times New Roman" font-size="3.8" fill="#111">3</text>
<path d="M76.0,35 L99.0,26" fill="none" stroke="#222" stroke-width=".42" marker-end="url(#arr)" />

<!-- outer border -->
<rect x="1" y="1" width="113" height="38" fill="none" stroke="#222" stroke-width=".5" />
</svg>